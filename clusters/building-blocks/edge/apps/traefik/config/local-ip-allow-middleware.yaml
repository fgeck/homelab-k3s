---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: local-ipallowlist
  namespace: edge
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
      - ${quote}${TRAEFIK_LOCAL_IP_ALLOW_CIDR}${quote}
      - ${quote}${TRAEFIK_LOCAL_IP_ALLOW_CIDR_1:=127.0.0.1/32}${quote}
      - ${quote}${TRAEFIK_LOCAL_IP_ALLOW_CIDR_2:=127.0.0.1/32}${quote}
      - ${quote}${TRAEFIK_LOCAL_IP_ALLOW_CIDR_3:=127.0.0.1/32}${quote}
      - 10.0.0.0/8 # Cilium's default pod CIDR
